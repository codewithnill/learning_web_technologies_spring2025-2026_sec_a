<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <table border="3" width="40%">
        <tr>
            <th colspan="3" id="tableheader">Person Profile</th>
        </tr>
        <tr>
            <td>
                Name
            </td>
             <td>
                 <input type="text" id="namebox" name="name" required>
            </td>
            <td>

            </td>
        </tr>

        <tr>
            <td>
                Email
            </td>
             <td>
                 <input type="text" id="namebox" name="name" required>
            </td>
            <td>

            </td>
        </tr>


        <tr>
            <td>
                Gender
            </td>
             <td>
                <input type="radio" id="g1" name="gender" value="male">
                <label for="g1">Male</label>
                
                <input type="radio" id="g2" name="gender" value="female">
                <label for="g2">Female</label>

                <input type="radio" id="g3" name="gender" value="other">
                <label for="g3">Other</label>
            </td>
            <td>

            </td>
        </tr>



        <tr>
            <td>
                Date of birth
            </td>
             <td>
               
                <input type="text" id="tb1" class="textbox" name="dd">
                <label>/</label>
                <input type="text" id="tb2" class="textbox" name="mm">
                <label>/</label>
                <input type="text" id="tb3" class="textbox" name="yyyy">
                <label>
                    <i>(dd/mm/yyyy)</i>
                </label>
            </td>
            <td>

            </td>
        </tr>


         <tr>
            <td>
                Blood Group
            </td>
             <td>
                <select id="bloodgroup" name="bloodgroup">
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </td>
            <td>

            </td>
        </tr>


        <tr>
            <td>
                Degree
            </td>
             <td>
                <input type="checkbox" id="ssc" name="degree" value="ssc">
                <label for="ssc">SSC</label>
                
                <input type="checkbox" id="hsc" name="degree" value="hsc">
                <label for="hsc">HSC</label>
                
                <input type="checkbox" id="bsc" name="bsc">
                <label for="bsc">BSc</label>

                <input type="checkbox" id="msc" name="msc">
                <label for="msc">MSc</label>
            </td>
            <td>

            </td>
        </tr>




        <tr>
            <td>
                Photo
            </td>
             <td>
               <input type="file" id="file" name="file" value="photo">
            </td>
            <td>

            </td>
        </tr>

        <tr>
            <td colspan="3">

            </td>
        </tr>

        <tr>
            <td colspan="3">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
            
        </tr>


     </table>
    </form>
     
</body>
</html>
