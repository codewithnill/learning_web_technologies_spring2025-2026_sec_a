<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form onsubmit="return validateprofile()">
        <table border="3" width="50%">
        <tr class="tablerows">
            <th colspan="3" id="tableheader">Person Profile</th>
        </tr>
        <tr class="tablerows">
            <td>
                Name
            </td>
             <td>
                 <input type="text" id="namebox" name="name">
            </td>
            <td class="tabledata">

            </td>
        </tr>

        <tr class="tablerows">
            <td>
                Email
            </td>
             <td>
                 <input type="text" id="emailbox" name="email">
            </td>
            <td class="tabledata">

            </td>
        </tr>


        <tr class="tablerows">
            <td>
                Gender
            </td>
             <td>
                <input type="radio" id="g1" name="gender" value="male">
                <label for="g1">Male</label>
                
                <input type="radio" id="g2" name="gender" value="female">
                <label for="g2">Female</label>

                <input type="radio" id="g3" name="gender" value="other">
                <label for="g3">Other</label>
            </td>
            <td class="tabledata">

            </td>
        </tr>



        <tr class="tablerows">
            <td>
                Date of birth
            </td>
             <td>
               
                <input type="text" id="dd" class="dob_box" name="dd">
                <label>/</label>
                <input type="text" id="mm" class="dob_box" name="mm">
                <label>/</label>
                <input type="text" id="yyyy" class="dob_box" name="yyyy">
                <label>
                    <i>(dd/mm/yyyy)</i>
                </label>
            </td>
            <td class="tabledata">

            </td>
        </tr>


         <tr class="tablerows">
            <td>
                Blood Group
            </td>
             <td>
                <select id="bloodgroup" name="bloodgroup">
                    <option value="">Select blood group</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </td>
            <td class="tabledata">

            </td>
        </tr>


        <tr class="tablerows">
            <td>
                Degree
            </td>
             <td>
                <input type="checkbox" id="ssc" name="degree" value="ssc">
                <label for="ssc">SSC</label>
                
                <input type="checkbox" id="hsc" name="degree" value="hsc">
                <label for="hsc">HSC</label>
                
                <input type="checkbox" id="bsc" name="degree" value="bsc">
                <label for="bsc">BSc</label>

                <input type="checkbox" id="msc" name="degree" value="msc">
                <label for="msc">MSc</label>
            </td>
            <td class="tabledata">

            </td>
        </tr>




        <tr class="tablerows">
            <td>
                Photo
            </td>
             <td>
               <input type="file" id="file" name="file" value="photo">
            </td>
            <td class="tabledata">

            </td>
        </tr>

        <tr class="tablerows">
            <td colspan="3">

            </td>
        </tr>

        <tr class="tablerows">
            <td colspan="3">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
            
        </tr>


     </table>
    </form>


    <script src="script2.js">
        
    </script>
     
</body>
</html>
