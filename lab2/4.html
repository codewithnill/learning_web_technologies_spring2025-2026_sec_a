<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dob">
        <form onsubmit="return validatedob">
            <fieldset id="dateset">
                <legend>Date of birth :</legend>

                <div class="date-group">
                    <label for="dd">dd</label>
                    <input type="text" id="dd" class="dateboxes" name="dd">
                </div>
                
                
                <div class="date-group">
                    <label for="mm">mm</label>
                    <input type="text" id="mm" class="dateboxes" name="mm">
                </div>
                
                
                <div class="date-group">
                    <label for="y">yyyy</label>
                    <input type="text" id="yyyy" class="dateboxes" name="yyyy">
                </div>
                
                <br>
                <hr>
                <input type="submit" value="Submit">
            </fieldset>  
        </form>     
    </div> 


    <script src="script.js">

    </script>
</body>
</html>
