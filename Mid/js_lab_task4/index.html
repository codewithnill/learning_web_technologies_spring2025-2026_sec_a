<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Lab Task 4 - Product Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>




    <div class="container">

        <h2>Product Management</h2>
        


        <div class="product_info">
            <p class="up_label"><strong>Unit Price : </strong>1000 BDT</p>
        </div>




        <div class="input" id="quantity_input">
            <label for="quantity">Quantity : </label>
            <input type="number" id="quantity" min="0">
        </div>




        <br>

        <div class="input" id="price_input">
            <label for="total" class="total_label">Total Price:</label>
            <input type="text" id="total" readonly value="0 BDT">
        </div>





    </div>




    <script src="script.js">

    </script>



</body>
</html>
